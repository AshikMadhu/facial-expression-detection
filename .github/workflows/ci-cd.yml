name: EmotionSense AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Code Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment (3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Package Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code Linting Compliance (Flake8)
      run: |
        pip install flake8
        # Stop build if there are Python syntax errors or undefined names
        flake8 packages/ml-models/src --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Execute Automated Test Suites
      run: |
        python -m unittest packages/ml-models/tests/test_suite.py

  build-and-push-docker:
    name: Build & Push Container Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compile and Push Production Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/emotionsense-ai:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/emotionsense-ai:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
